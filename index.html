<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<title>Speed</title>
<style>
  :root {
    --bg: #000000;
    --surface: #1C1C1E;
    --surface-2: #2C2C2E;
    --separator: rgba(84, 84, 88, 0.6);
    --label: #FFFFFF;
    --label-2: rgba(235, 235, 245, 0.6);
    --label-3: rgba(235, 235, 245, 0.3);
    --blue: #0A84FF;
    --green: #30D158;
    --red: #FF453A;
    --orange: #FF9F0A;
    --radius: 14px;
    --pad: 16px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  body {
    min-height: 100svh;
    padding:
      calc(env(safe-area-inset-top) + 8px)
      calc(env(safe-area-inset-right) + var(--pad))
      calc(env(safe-area-inset-bottom) + 12px)
      calc(env(safe-area-inset-left) + var(--pad));
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 560px;
    margin: 0 auto;
  }

  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  /* ---- header ---- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 32px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.4px;
    margin: 0;
  }
  .signal {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--label-2);
    letter-spacing: -0.1px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--label-3);
    transition: background-color .3s ease;
  }
  .dot.good { background: var(--green); }
  .dot.fair { background: var(--orange); }
  .dot.poor { background: var(--red); }

  /* ---- gauge ---- */
  .gauge {
    position: relative;
    width: 100%;
    max-width: 320px;
    margin: 2px auto 0;
    aspect-ratio: 1 / 0.92;
  }
  .gauge svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .track { stroke: var(--surface-2); }
  .progress {
    stroke: var(--green);
    transition: stroke .6s linear;
  }
  .tick { stroke: var(--label-3); stroke-width: 2; stroke-linecap: round; }
  .tick-label {
    fill: var(--label-3);
    font-size: 11px;
    font-weight: 500;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
  }

  .readout {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: 6%;
    pointer-events: none;
  }
  .value {
    font-size: clamp(64px, 22vw, 88px);
    font-weight: 600;
    letter-spacing: -3px;
    line-height: 1;
  }
  .unit {
    margin-top: 6px;
    font-size: 15px;
    font-weight: 500;
    color: var(--label-2);
    letter-spacing: 0.2px;
  }

  /* ---- segmented control ---- */
  .segmented {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--surface-2);
    border-radius: 9px;
    padding: 2px;
    width: 180px;
    margin: 0 auto;
  }
  .segmented button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--label);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 0;
    border-radius: 7px;
    cursor: pointer;
    transition: background-color .2s ease;
  }
  .segmented button[aria-selected="true"] {
    background: #636366;
    font-weight: 600;
  }

  /* ---- cards ---- */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--label-2);
    letter-spacing: -0.1px;
  }
  .card-note { font-size: 12px; color: var(--label-3); }

  #chart { display: block; width: 100%; height: 110px; }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--separator);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .stat {
    background: var(--surface);
    padding: 12px 16px;
  }
  .stat-label {
    font-size: 12px;
    color: var(--label-2);
    letter-spacing: -0.05px;
  }
  .stat-value {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.4px;
    margin-top: 2px;
  }
  .stat-value small {
    font-size: 12px;
    font-weight: 500;
    color: var(--label-2);
    letter-spacing: 0;
    margin-left: 2px;
  }

  /* ---- controls ---- */
  .controls {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding-top: 4px;
  }
  .primary {
    appearance: none;
    border: 0;
    width: 100%;
    background: var(--blue);
    color: #fff;
    font: inherit;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.2px;
    padding: 15px;
    border-radius: 13px;
    cursor: pointer;
    transition: opacity .15s ease, transform .1s ease;
  }
  .primary:active { transform: scale(0.985); opacity: .85; }
  .primary.stop { background: var(--surface-2); }
  .ghost {
    appearance: none;
    border: 0;
    background: none;
    color: var(--blue);
    font: inherit;
    font-size: 15px;
    padding: 4px 12px;
    cursor: pointer;
  }
  .ghost:disabled { color: var(--label-3); cursor: default; }

  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }

  /* ---- message ---- */
  .message {
    display: none;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.45;
    color: var(--label-2);
  }
  .message.show { display: block; }
  .message strong { color: var(--label); font-weight: 600; display: block; margin-bottom: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>Speed</h1>
  <span class="signal"><span class="dot" id="dot"></span><span id="signalText">Not tracking</span></span>
</header>

<div class="gauge">
  <svg viewBox="0 0 240 224" aria-hidden="true">
    <g id="ticks"></g>
    <path id="track" class="track" fill="none" stroke-width="14" stroke-linecap="round" />
    <path id="progress" class="progress" fill="none" stroke-width="14" stroke-linecap="round" />
  </svg>
  <div class="readout">
    <div class="value num" id="value" role="status" aria-live="off">0</div>
    <div class="unit" id="unitLabel">km/h</div>
  </div>
</div>

<div class="segmented" role="tablist" aria-label="Units">
  <button role="tab" id="btnKmh" aria-selected="true">km/h</button>
  <button role="tab" id="btnMph" aria-selected="false">mph</button>
</div>

<div class="message" id="message"></div>

<div class="card">
  <div class="card-head">
    <span class="card-title">Speed over time</span>
    <span class="card-note" id="windowNote">Last 2 min</span>
  </div>
  <canvas id="chart"></canvas>
</div>

<div class="stats">
  <div class="stat">
    <div class="stat-label">Average</div>
    <div class="stat-value num" id="avg">0<small id="avgUnit">km/h</small></div>
  </div>
  <div class="stat">
    <div class="stat-label">Top speed</div>
    <div class="stat-value num" id="max">0<small id="maxUnit">km/h</small></div>
  </div>
  <div class="stat">
    <div class="stat-label">Distance</div>
    <div class="stat-value num" id="dist">0<small id="distUnit">km</small></div>
  </div>
  <div class="stat">
    <div class="stat-label">Duration</div>
    <div class="stat-value num" id="time">0:00</div>
  </div>
</div>

<div class="controls">
  <button class="primary" id="startStop">Start tracking</button>
  <button class="ghost" id="reset" disabled>Reset trip</button>
</div>

<script>
(function () {
  'use strict';

  // ---------- config ----------
  var WINDOW_MS = 120000;          // chart window
  var NOISE_FLOOR = 0.6;           // m/s — below this, treat as stationary (GPS drift)
  var MAX_ACCURACY = 40;           // metres — ignore fixes worse than this for distance
  var SMOOTHING = 0.35;            // display smoothing factor
  var KMH_SCALES = [30, 60, 120, 180, 240];
  var MPH_SCALES = [20, 40, 80, 120, 160];

  // ---------- state ----------
  var tracking = false;
  var watchId = null;
  var wakeLock = null;
  var unit = 'kmh';

  var samples = [];        // {t, v}  v in m/s
  var rawSpeed = 0;        // latest m/s
  var shownSpeed = 0;      // smoothed, for display
  var topSpeed = 0;
  var distance = 0;        // metres
  var elapsed = 0;         // ms of tracking
  var lastFix = null;
  var startedAt = 0;
  var scaleMax = KMH_SCALES[1];

  // ---------- elements ----------
  var $ = function (id) { return document.getElementById(id); };
  var elValue = $('value'), elUnit = $('unitLabel'), elAvg = $('avg'), elMax = $('max'),
      elDist = $('dist'), elTime = $('time'), elDot = $('dot'), elSignal = $('signalText'),
      elStart = $('startStop'), elReset = $('reset'), elMsg = $('message'),
      elProgress = $('progress'), elTrack = $('track'), elTicks = $('ticks'),
      canvas = $('chart'), ctx = canvas.getContext('2d');

  // ---------- gauge geometry ----------
  var CX = 120, CY = 120, R = 92, START = 135, SWEEP = 270;
  var ARC_LEN = 2 * Math.PI * R * (SWEEP / 360);

  function polar(angleDeg, radius) {
    var a = angleDeg * Math.PI / 180;
    return [CX + radius * Math.cos(a), CY + radius * Math.sin(a)];
  }

  function arcPath(radius) {
    var s = polar(START, radius), e = polar(START + SWEEP, radius);
    return 'M ' + s[0].toFixed(2) + ' ' + s[1].toFixed(2) +
           ' A ' + radius + ' ' + radius + ' 0 1 1 ' + e[0].toFixed(2) + ' ' + e[1].toFixed(2);
  }

  elTrack.setAttribute('d', arcPath(R));
  elProgress.setAttribute('d', arcPath(R));
  elProgress.style.strokeDasharray = ARC_LEN;
  elProgress.style.strokeDashoffset = ARC_LEN;

  function drawTicks() {
    var svgns = 'http://www.w3.org/2000/svg';
    elTicks.textContent = '';
    for (var i = 0; i <= 8; i++) {
      var ang = START + (SWEEP * i / 8);
      var major = i % 2 === 0;
      var p1 = polar(ang, R - 13), p2 = polar(ang, major ? R - 20 : R - 17);
      var line = document.createElementNS(svgns, 'line');
      line.setAttribute('x1', p1[0]); line.setAttribute('y1', p1[1]);
      line.setAttribute('x2', p2[0]); line.setAttribute('y2', p2[1]);
      line.setAttribute('class', 'tick');
      if (!major) line.setAttribute('opacity', '0.5');
      elTicks.appendChild(line);

      if (major) {
        var lp = polar(ang, R - 33);
        var t = document.createElementNS(svgns, 'text');
        t.setAttribute('x', lp[0]); t.setAttribute('y', lp[1] + 4);
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('class', 'tick-label');
        t.textContent = Math.round(scaleMax * i / 8);
        elTicks.appendChild(t);
      }
    }
  }

  // ---------- units ----------
  function toUnit(ms) { return unit === 'kmh' ? ms * 3.6 : ms * 2.236936; }
  function speedUnitLabel() { return unit === 'kmh' ? 'km/h' : 'mph'; }
  function distUnitLabel() { return unit === 'kmh' ? 'km' : 'mi'; }
  function toDistUnit(m) { return unit === 'kmh' ? m / 1000 : m / 1609.344; }
  function scales() { return unit === 'kmh' ? KMH_SCALES : MPH_SCALES; }

  function pickScale() {
    var peak = toUnit(Math.max(topSpeed, rawSpeed));
    var list = scales();
    for (var i = 0; i < list.length; i++) {
      if (peak <= list[i] * 0.92) return list[i];
    }
    return list[list.length - 1];
  }

  function setUnit(u) {
    unit = u;
    $('btnKmh').setAttribute('aria-selected', String(u === 'kmh'));
    $('btnMph').setAttribute('aria-selected', String(u === 'mph'));
    elUnit.textContent = speedUnitLabel();
    $('avgUnit').textContent = speedUnitLabel();
    $('maxUnit').textContent = speedUnitLabel();
    $('distUnit').textContent = distUnitLabel();
    scaleMax = pickScale();
    drawTicks();
    renderStats();
    drawChart();
  }

  // ---------- geo ----------
  function haversine(a, b) {
    var R6 = 6371000, toRad = Math.PI / 180;
    var dLat = (b.lat - a.lat) * toRad, dLon = (b.lon - a.lon) * toRad;
    var la1 = a.lat * toRad, la2 = b.lat * toRad;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R6 * Math.asin(Math.sqrt(h));
  }

  function onPosition(pos) {
    var c = pos.coords;
    var now = pos.timestamp || Date.now();
    var fix = { lat: c.latitude, lon: c.longitude, t: now, acc: c.accuracy };

    var speed = (typeof c.speed === 'number' && c.speed >= 0) ? c.speed : null;
    var step = 0;

    if (lastFix) {
      var dt = (now - lastFix.t) / 1000;
      if (dt > 0.2 && dt < 30) {
        var d = haversine(lastFix, fix);
        if (c.accuracy <= MAX_ACCURACY && d > c.accuracy * 0.5) step = d;
        if (speed === null) speed = d / dt;   // fallback when the device gives no speed
      }
    }
    if (speed === null) speed = 0;
    if (speed < NOISE_FLOOR) { speed = 0; step = 0; }

    rawSpeed = speed;
    distance += step;
    if (speed > topSpeed) topSpeed = speed;

    samples.push({ t: now, v: speed });
    var cutoff = now - WINDOW_MS * 1.2;
    while (samples.length && samples[0].t < cutoff) samples.shift();

    lastFix = fix;
    updateSignal(c.accuracy);

    var want = pickScale();
    if (want !== scaleMax) { scaleMax = want; drawTicks(); }
  }

  function onError(err) {
    stop();
    if (err.code === 1) {
      showMessage('Location access is off',
        'Tap the ⌵ in the address bar → Website Settings → Location → Allow, then reload. In the Home Screen app, check Settings → Privacy & Security → Location Services.');
    } else if (err.code === 2) {
      showMessage('No position available', 'Move somewhere with a clearer view of the sky and start again.');
    } else {
      showMessage('Location timed out', 'The device took too long to get a fix. Try starting again.');
    }
  }

  function updateSignal(acc) {
    elDot.className = 'dot ' + (acc <= 10 ? 'good' : acc <= 30 ? 'fair' : 'poor');
    elSignal.textContent = '±' + Math.round(acc) + ' m';
  }

  // ---------- messages ----------
  function showMessage(title, body) {
    elMsg.innerHTML = '';
    var s = document.createElement('strong');
    s.textContent = title;
    elMsg.appendChild(s);
    elMsg.appendChild(document.createTextNode(body));
    elMsg.classList.add('show');
  }
  function clearMessage() { elMsg.classList.remove('show'); }

  // ---------- wake lock ----------
  function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (l) {
      wakeLock = l;
      l.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && tracking && !wakeLock) requestWakeLock();
  });

  // ---------- start / stop / reset ----------
  function start() {
    if (!('geolocation' in navigator)) {
      showMessage('This browser has no location support', 'Open the page in Safari on your iPhone.');
      return;
    }
    if (!window.isSecureContext) {
      showMessage('Location needs a secure connection',
        'Serve this page over https:// (GitHub Pages works) or open it at localhost. Location is blocked on plain http.');
      return;
    }
    clearMessage();
    tracking = true;
    startedAt = Date.now();
    lastFix = null;
    elStart.textContent = 'Pause';
    elStart.classList.add('stop');
    elReset.disabled = false;
    elSignal.textContent = 'Finding you…';
    watchId = navigator.geolocation.watchPosition(onPosition, onError, {
      enableHighAccuracy: true, maximumAge: 0, timeout: 20000
    });
    requestWakeLock();
  }

  function stop() {
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    if (tracking) elapsed += Date.now() - startedAt;
    tracking = false;
    rawSpeed = 0;
    lastFix = null;
    elStart.textContent = 'Resume';
    elStart.classList.remove('stop');
    elDot.className = 'dot';
    elSignal.textContent = 'Paused';
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }

  function reset() {
    stop();
    samples = []; topSpeed = 0; distance = 0; elapsed = 0;
    rawSpeed = 0; shownSpeed = 0;
    elStart.textContent = 'Start tracking';
    elReset.disabled = true;
    elSignal.textContent = 'Not tracking';
    clearMessage();
    scaleMax = scales()[1];
    drawTicks();
    renderStats();
    drawChart();
  }

  elStart.addEventListener('click', function () { tracking ? stop() : start(); });
  elReset.addEventListener('click', reset);
  $('btnKmh').addEventListener('click', function () { setUnit('kmh'); });
  $('btnMph').addEventListener('click', function () { setUnit('mph'); });

  // ---------- chart ----------
  function sizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawChart();
  }
  window.addEventListener('resize', sizeCanvas);

  function drawChart() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    ctx.clearRect(0, 0, w, h);

    var padB = 4, padT = 6;
    var now = Date.now();
    var t0 = now - WINDOW_MS;
    var pts = samples.filter(function (s) { return s.t >= t0; });

    // baseline
    ctx.strokeStyle = 'rgba(84,84,88,0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, h - padB + 0.5);
    ctx.lineTo(w, h - padB + 0.5);
    ctx.stroke();

    if (pts.length < 2) {
      ctx.fillStyle = 'rgba(235,235,245,0.3)';
      ctx.font = '500 13px -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(tracking ? 'Waiting for movement' : 'Start tracking to record a trace', w / 2, h / 2);
      return;
    }

    var peak = 0;
    pts.forEach(function (s) { if (s.v > peak) peak = s.v; });
    var yMax = Math.max(peak * 1.15, 1);

    var x = function (t) { return (t - t0) / WINDOW_MS * w; };
    var y = function (v) { return (h - padB) - (v / yMax) * (h - padB - padT); };

    // area fill
    var grad = ctx.createLinearGradient(0, padT, 0, h);
    grad.addColorStop(0, 'rgba(48,209,88,0.28)');
    grad.addColorStop(1, 'rgba(48,209,88,0.0)');
    ctx.beginPath();
    ctx.moveTo(x(pts[0].t), h - padB);
    pts.forEach(function (s) { ctx.lineTo(x(s.t), y(s.v)); });
    ctx.lineTo(x(pts[pts.length - 1].t), h - padB);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // line
    ctx.beginPath();
    pts.forEach(function (s, i) { i ? ctx.lineTo(x(s.t), y(s.v)) : ctx.moveTo(x(s.t), y(s.v)); });
    ctx.strokeStyle = '#30D158';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    // head dot
    var last = pts[pts.length - 1];
    ctx.beginPath();
    ctx.arc(x(last.t), y(last.v), 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#30D158';
    ctx.fill();

    // peak label
    ctx.fillStyle = 'rgba(235,235,245,0.45)';
    ctx.font = '500 11px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(Math.round(toUnit(peak)) + ' ' + speedUnitLabel(), 2, padT + 8);
  }

  // ---------- stats ----------
  function fmtDuration(ms) {
    var s = Math.floor(ms / 1000);
    var hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return hh ? hh + ':' + pad(mm) + ':' + pad(ss) : mm + ':' + pad(ss);
  }

  function totalElapsed() { return elapsed + (tracking ? Date.now() - startedAt : 0); }

  function renderStats() {
    var ms = totalElapsed();
    var avgMs = ms > 1000 ? distance / (ms / 1000) : 0;
    elAvg.firstChild.nodeValue = (toUnit(avgMs)).toFixed(1);
    elMax.firstChild.nodeValue = (toUnit(topSpeed)).toFixed(1);
    elDist.firstChild.nodeValue = (toDistUnit(distance)).toFixed(2);
    elTime.textContent = fmtDuration(ms);
  }

  // ---------- render loop ----------
  var lastChart = 0;
  function frame(ts) {
    shownSpeed += (rawSpeed - shownSpeed) * SMOOTHING;
    if (Math.abs(rawSpeed - shownSpeed) < 0.02) shownSpeed = rawSpeed;

    var display = toUnit(shownSpeed);
    elValue.textContent = display < 10 ? display.toFixed(1) : String(Math.round(display));

    var frac = Math.min(display / scaleMax, 1);
    elProgress.style.strokeDashoffset = ARC_LEN * (1 - frac);
    elProgress.style.stroke = frac > 0.85 ? '#FF453A' : frac > 0.65 ? '#FF9F0A' : '#30D158';

    renderStats();
    if (ts - lastChart > 500) { drawChart(); lastChart = ts; }
    requestAnimationFrame(frame);
  }

  // ---------- boot ----------
  setUnit('kmh');
  sizeCanvas();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
